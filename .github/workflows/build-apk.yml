name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1 & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare versioning, signing keystore, and environment file
        run: |
          NEXT_CODE=$((GITHUB_RUN_NUMBER + 1))
          NEXT_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "ESOSA_VERSION_CODE=${NEXT_CODE}" >> "$GITHUB_ENV"
          echo "ESOSA_VERSION_NAME=${NEXT_NAME}" >> "$GITHUB_ENV"
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Rename APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk "Esosa-v${ESOSA_VERSION_NAME}.apk"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Esosa-debug-apk
          path: Esosa-v*.apk
          retention-days: 90

      - name: Publish Versioned APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ESOSA_VERSION_NAME }}
          name: Esosa v${{ env.ESOSA_VERSION_NAME }}
          body: |
            Automated build of **Esosa v${{ env.ESOSA_VERSION_NAME }}** (build `${{ env.ESOSA_VERSION_CODE }}`, `${{ github.repository }}`).
            Download the `.apk` asset below to update your Android device.
          files: Esosa-v*.apk
          make_latest: true
