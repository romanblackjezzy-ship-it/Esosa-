name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK 36.1 & licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646d8abd\n' > "$SDK_ROOT/licenses/android-sdk-preview-license"
          yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"
          "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install "platforms;android-36" || true
          "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install "build-tools;36.1.0" || true
          test -f "$SDK_ROOT/platforms/android-36.1/android.jar"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-disabled: true

      - name: Prepare versioning, signing keystore, and environment file
        run: |
          NEXT_CODE=$((GITHUB_RUN_NUMBER + 1))
          NEXT_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "ESOSA_VERSION_CODE=${NEXT_CODE}" >> "$GITHUB_ENV"
          echo "ESOSA_VERSION_NAME=${NEXT_NAME}" >> "$GITHUB_ENV"
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          if [ ! -f .env ]; then
            touch .env
          fi
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ls -la app/google-services.json app/src/main/res/values/firebase_applet_config.xml debug.keystore .env .env.example || true

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
        run: |
          set -o pipefail
          echo "Java: $(java -version 2>&1 | head -n 1)"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "Version: ${ESOSA_VERSION_NAME} (${ESOSA_VERSION_CODE}) Repo: ${GITHUB_REPOSITORY}"
          if ! gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --max-workers=1 \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee ci-build.log; then
            echo "=== LAST 80 LINES OF CI BUILD LOG ==="
            tail -n 80 ci-build.log || true
            ERROR_LINE="$(grep -E '^e: |FAILURE:|BUILD FAILED|\* What went wrong:' ci-build.log | tail -n 5 | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')"
            echo "::error title=Build Debug APK failed::${ERROR_LINE:-See ci-build.log in job summary/artifacts}"
            exit 1
          fi

      - name: Summarize CI build failure
        if: failure() && hashFiles('ci-build.log') != ''
        run: |
          {
            echo "### Build Debug APK Failure Log (tail)"
            echo '```text'
            tail -n 120 ci-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-failure-log
          path: ci-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk "Esosa-v${ESOSA_VERSION_NAME}.apk"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Esosa-debug-apk
          path: Esosa-v*.apk
          retention-days: 90

      - name: Publish Versioned APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ESOSA_VERSION_NAME }}
          name: Esosa v${{ env.ESOSA_VERSION_NAME }}
          body: |
            Automated build of **Esosa v${{ env.ESOSA_VERSION_NAME }}** (build `${{ env.ESOSA_VERSION_CODE }}`, `${{ github.repository }}`).
            Download the `.apk` asset below to update your Android device.
          files: Esosa-v*.apk
          make_latest: true
