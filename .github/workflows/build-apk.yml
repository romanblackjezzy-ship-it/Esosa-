name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare signing keystore and environment file
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Esosa-debug.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Esosa-debug-apk
          path: Esosa-debug.apk
          retention-days: 90

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Esosa Android APK (Latest)
          body: |
            Automated build of **Esosa** (`com.aistudio.esosachat.xkmqzp`).
            Download `Esosa-debug.apk` below to install on your Android device.
          files: Esosa-debug.apk
          make_latest: true
