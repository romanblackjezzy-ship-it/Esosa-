name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK 36.1 & licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646d8abd\n' > "$SDK_ROOT/licenses/android-sdk-preview-license"
          yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"
          "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install "build-tools;36.1.0" || true
          test -f "$SDK_ROOT/platforms/android-36.1/android.jar"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-disabled: true

      - name: Prepare versioning, signing keystore, and Firebase config
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_DEBUG_KEYSTORE_B64_SECRET: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import time
          import urllib.request

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1") or "1")
          token = os.environ.get("GH_TOKEN", "")

          max_release_build = 0
          max_patch = 0

          if repo:
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases?per_page=100",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "Esosa-CI-Versioner",
                          **({"Authorization": f"Bearer {token}"} if token else {}),
                      },
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      releases = json.loads(resp.read().decode("utf-8"))
                  for rel in releases:
                      body = rel.get("body") or ""
                      m_build = re.search(r"build\s+`?(\d+)`?", body, re.IGNORECASE)
                      if m_build:
                          max_release_build = max(max_release_build, int(m_build.group(1)))
                      tag = (rel.get("tag_name") or "").lstrip("vV")
                      m_patch = re.match(r"^1\.0\.(\d+)$", tag)
                      if m_patch:
                          max_patch = max(max_patch, int(m_patch.group(1)))
              except Exception as exc:
                  print(f"Release metadata lookup skipped: {exc}")

          # Epoch minutes (~29,900,000 in 2026) always fits in signed 32-bit Int (<2.1B),
          # exceeds prior run-number-based builds (1..1,000,000), and guarantees monotonic upgrades
          # even if workflows or repositories are recreated.
          time_code = int(time.time()) // 60
          next_code = max(max_release_build + 1, time_code, run_number + 1)
          next_patch = max(max_patch + 1, run_number)
          next_name = f"1.0.{next_patch}"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ESOSA_VERSION_CODE={next_code}\n")
              env_file.write(f"ESOSA_VERSION_NAME={next_name}\n")

          print(f"Resolved ESOSA_VERSION_CODE={next_code}, ESOSA_VERSION_NAME={next_name}")
          PYEOF

          CANONICAL_SHA256="73:F4:D7:D0:3F:A5:5C:1E:63:77:35:72:BD:D7:40:97:90:A5:F0:A8:A6:07:D7:3F:F7:A1:0E:96:65:80:98:27"
          CANONICAL_B64=""

          # Ensure the official canonical keystore is used so SHA-1 matches Firebase
          if [ -s debug.keystore.base64 ]; then
            tr -d '\r\n\t ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "$CANONICAL_B64" | tr -d '\r\n\t ' | base64 -d > debug.keystore
          fi

          if ! keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey > keystore-info.txt 2>&1; then
            echo "$CANONICAL_B64" | tr -d '\r\n\t ' | base64 -d > debug.keystore
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey > keystore-info.txt 2>&1
          fi

          KEYSTORE_SHA1="$(grep -m1 'SHA1:' keystore-info.txt | sed 's/.*SHA1:[[:space:]]*//' | tr -d '\r')"
          KEYSTORE_SHA256="$(grep -m1 'SHA256:' keystore-info.txt | sed 's/.*SHA256:[[:space:]]*//' | tr -d '\r')"
          rm -f keystore-info.txt

          if [ "${KEYSTORE_SHA256}" != "${CANONICAL_SHA256}" ]; then
            echo "Re-writing canonical debug.keystore..."
            echo "$CANONICAL_B64" | tr -d '\r\n\t ' | base64 -d > debug.keystore
            KEYSTORE_SHA256="${CANONICAL_SHA256}"
            KEYSTORE_SHA1="9D:A2:FE:0B:A0:D1:CF:5C:FC:09:46:AA:F4:0A:5A:1D:D1:2F:FE:10"
          fi

          echo "KEYSTORE_SHA1=${KEYSTORE_SHA1}" >> "$GITHUB_ENV"
          echo "KEYSTORE_SHA256=${KEYSTORE_SHA256}" >> "$GITHUB_ENV"
          echo "Restored debug.keystore (source=${KEYSTORE_SOURCE}, SHA1=${KEYSTORE_SHA1}, SHA256=${KEYSTORE_SHA256})"

          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          mkdir -p app
          FIREBASE_CONFIG_MODE="repo"
          FIREBASE_CONFIG_NOTE=""
          if [ -s app/google-services.json ]; then
            echo "Found committed app/google-services.json in repository."
          elif [ -n "${GOOGLE_SERVICES_JSON_SECRET}" ]; then
            printf '%s\n' "${GOOGLE_SERVICES_JSON_SECRET}" > app/google-services.json
            python3 -m json.tool app/google-services.json >/dev/null
            FIREBASE_CONFIG_MODE="secret"
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "${GOOGLE_SERVICES_JSON_B64_SECRET}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON_B64_SECRET}" | tr -d '\r\n\t ' | base64 -d > app/google-services.json
            python3 -m json.tool app/google-services.json >/dev/null
            FIREBASE_CONFIG_MODE="secret_base64"
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            FIREBASE_CONFIG_MODE="valid_prod"
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1074191788431",
              "project_id": "gen-lang-client-0323222168",
              "storage_bucket": "gen-lang-client-0323222168.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1074191788431:android:06961532f3cdd4030743fa",
                  "android_client_info": {
                    "package_name": "com.aistudio.esosa.chat.v3net"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "1074191788431-jtvqj4qbs2evbk7ecgbulh3rbpr830es.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.esosa.chat.v3net",
                      "certificate_hash": "9da2fe0ba0d1cf5cfc0946aaf40a5a1dd12ffe10"
                    }
                  },
                  {
                    "client_id": "1074191788431-ln79cuak607jj1bti393i0n6ev73nkdo.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCfPgTXioG9lfGr4vo9sdFCKWol8GhAvDg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "1074191788431-ln79cuak607jj1bti393i0n6ev73nkdo.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          echo "FIREBASE_CONFIG_MODE=${FIREBASE_CONFIG_MODE}" >> "$GITHUB_ENV"
          ls -la app/google-services.json app/src/main/res/values/firebase_applet_config.xml debug.keystore .env .env.example || true

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx1g -Dfile.encoding=UTF-8"
        run: |
          echo "Java: $(java -version 2>&1 | head -n 1)"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "Version: ${ESOSA_VERSION_NAME} (${ESOSA_VERSION_CODE}) Repo: ${GITHUB_REPOSITORY}"
          free -m || true
          df -h . || true
          set +e
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --max-workers=1 \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.caching=false \
            -Dorg.gradle.configuration-cache=false \
            -Dorg.gradle.workers.max=1 \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=640m -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            2>&1 | tee ci-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "=== GRADLE EXITED WITH CODE ${BUILD_STATUS} ===" >&2
            echo "=== LAST 100 LINES OF CI BUILD LOG ===" >&2
            tail -n 100 ci-build.log >&2 || true
            ERROR_LINE="$(grep -E '^e: |FAILURE:|BUILD FAILED|\* What went wrong:|OutOfMemoryError|daemon has disappeared' ci-build.log | tail -n 5 | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')"
            echo "::error title=Build Debug APK failed (exit ${BUILD_STATUS})::${ERROR_LINE:-Exited with code ${BUILD_STATUS}. See ci-build.log in job summary/artifacts}"
            exit "$BUILD_STATUS"
          fi

      - name: Verify APK package ID, versionCode, and signing certificate
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT2"

          "$APKSIGNER" verify --print-certs -v "$APK_PATH" | tee apk-certs.txt
          "$AAPT2" dump badging "$APK_PATH" | head -n 5 | tee apk-badging.txt

          grep -q "package: name='com.aistudio.esosa.chat.v3net'" apk-badging.txt
          grep -q "versionCode='${ESOSA_VERSION_CODE}'" apk-badging.txt

          APK_SHA256_RAW="$(grep -iE 'certificate sha-256 digest:' apk-certs.txt | head -n1 | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          if echo "$APK_SHA256_RAW" | grep -q ':'; then
            APK_SHA256_COLON="$APK_SHA256_RAW"
          elif [ -n "$APK_SHA256_RAW" ]; then
            APK_SHA256_COLON="$(echo "$APK_SHA256_RAW" | sed 's/../&:/g; s/:$//')"
          else
            APK_SHA256_COLON=""
          fi

          rm -f apk-certs.txt apk-badging.txt

          if [ -z "$APK_SHA256_COLON" ]; then
            echo "::error title=Missing APK SHA-256 digest::Failed to extract certificate SHA-256 digest from apksigner output."
            exit 1
          fi

          if [ -n "${KEYSTORE_SHA256}" ] && [ "$APK_SHA256_COLON" != "${KEYSTORE_SHA256}" ]; then
            echo "::error title=APK signature mismatch::APK SHA-256 (${APK_SHA256_COLON}) does not match keystore SHA-256 (${KEYSTORE_SHA256})."
            exit 1
          fi
          echo "APK_SHA256=${APK_SHA256_COLON}" >> "$GITHUB_ENV"
          echo "Verified APK com.aistudio.esosa.chat.v3net v${ESOSA_VERSION_NAME} (${ESOSA_VERSION_CODE}) signed with ${APK_SHA256_COLON}"

      - name: Summarize CI build failure
        if: failure() && hashFiles('ci-build.log') != ''
        run: |
          {
            echo "### Build Debug APK Failure Log (tail)"
            echo '```text'
            tail -n 140 ci-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-failure-log
          path: ci-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk "Esosa-v${ESOSA_VERSION_NAME}.apk"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Esosa-debug-apk
          path: Esosa-v*.apk
          retention-days: 90

      - name: Publish Versioned APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ESOSA_VERSION_NAME }}
          name: Esosa v${{ env.ESOSA_VERSION_NAME }}
          body: |
            Esosa v${{ env.ESOSA_VERSION_NAME }} includes performance improvements, enhanced account security, real-time messaging, and photo sharing.
          files: Esosa-v*.apk
          make_latest: true
